
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akash Market</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5;color:#17211b}header{background:#123c28;color:white;padding:20px;text-align:center;font-size:25px;font-weight:bold}.hero{text-align:center;background:#d9f99d;padding:30px 15px}.hero h1{font-size:32px}.search{width:90%;padding:13px;border:1px solid #ccc;border-radius:8px}.products{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px #0001}.pic{font-size:48px;background:#edf4ec;padding:15px;border-radius:10px}.price{font-size:19px;font-weight:bold;color:#16794b}.btn{background:#16794b;color:white;border:0;border-radius:8px;padding:11px;width:100%}footer{background:#123c28;color:white;text-align:center;padding:20px}@media(min-width:650px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>🛍️ AKASH MARKET</header>
<section class="hero"><h1>Shop Smart. Live Better.</h1><p>Your everyday online market</p><input class="search" id="q" placeholder="Search products..." oninput="filter()"></section>
<main class="products" id="products">
<div class="card" data-name="Fresh Apples"><div class="pic">🍎</div><h3>Fresh Apples</h3><p class="price">৳280</p><button class="btn" onclick="order('Fresh Apples',280)">Order Now</button></div>
<div class="card" data-name="Coffee Mug"><div class="pic">☕</div><h3>Coffee Mug</h3><p class="price">৳220</p><button class="btn" onclick="order('Coffee Mug',220)">Order Now</button></div>
<div class="card" data-name="T Shirt"><div class="pic">👕</div><h3>T-Shirt</h3><p class="price">৳450</p><button class="btn" onclick="order('T-Shirt',450)">Order Now</button></div>
<div class="card" data-name="Wireless Earbuds"><div class="pic">🎧</div><h3>Wireless Earbuds</h3><p class="price">৳1250</p><button class="btn" onclick="order('Wireless Earbuds',1250)">Order Now</button></div>
<div class="card" data-name="Backpack"><div class="pic">🎒</div><h3>Backpack</h3><p class="price">৳890</p><button class="btn" onclick="order('Backpack',890)">Order Now</button></div>
<div class="card" data-name="Fresh Bananas"><div class="pic">🍌</div><h3>Fresh Bananas</h3><p class="price">৳80</p><button class="btn" onclick="order('Fresh Bananas',80)">Order Now</button></div>
</main>
<footer><h3>AKASH MARKET</h3><p>Contact us to place your order.</p></footer>
<script>
function filter(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.dataset.name.toLowerCase().includes(q)?'block':'none')}
function order(name,price){alert('You selected '+name+' - ৳'+price+'. Please contact the store to complete your order.')}
</script>
</body>
</html>
